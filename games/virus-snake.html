<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Tail Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .instructions {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 450px;
            line-height: 1.4;
        }

        .scoreboard {
            display: flex;
            gap: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #score { color: #ffeb3b; }
        #length { color: #00bcd4; }
        #danger { color: #ff5722; }
        #status { color: #4CAF50; transition: color 0.2s; }
        #status.infected { color: #9c27b0; text-shadow: 0 0 8px rgba(156, 39, 176, 0.6); }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid #333;
        }

        canvas {
            background-color: #111111;
            display: block;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .game-overlay.hidden {
            display: none;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .overlay-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #4CAF50;
            font-weight: bold;
            text-align: center;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <h1>Snake Split</h1>
    <div class="instructions">
        Move with <b>WASD</b> or <b>Arrow Keys</b>. Snake grows automatically.<br>
        Purple blocks cross the screen. Touch one to get infected. Cut your tail to isolate and cure the virus before it reaches your head!
    </div>

    <div class="scoreboard">
        <div>Score: <span id="score">0</span></div>
        <div>Length: <span id="length">5</span></div>
        <div>Danger Level: <span id="danger">1</span></div>
        <div>Status: <span id="status">Healthy</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="440" height="440"></canvas>
        <div id="overlay" class="game-overlay">
            <div id="overlayText" class="overlay-title">SNAKE SPLIT</div>
            <button id="startBtn" class="btn">Play Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const lengthElement = document.getElementById('length');
        const dangerElement = document.getElementById('danger');
        const statusElement = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game State Variables
        let snake = [];
        let viruses = [];
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isGameRunning = false;
        let changingDirection = false;

        // Growth & Scaling Variables
        let stepCount = 0;
        let lifetimeSteps = 0;
        const stepsPerGrowth = 8;
        const stepsPerDangerIncrease = 25; // Accelerated progression!

        // Virus State Variables
        let isInfected = false;
        let virusProgress = 0; 
        let virusSpreadCounter = 0;
        const virusSpreadDelay = 3; 

        window.addEventListener('keydown', handleKeyDown);
        startBtn.addEventListener('click', startGame);

        function startGame() {
            snake = [
                { x: 12, y: 11 }, { x: 11, y: 11 }, { x: 10, y: 11 },
                { x: 9, y: 11 }, { x: 8, y: 11 }
            ];
            
            dx = 1; dy = 0;
            score = 0;
            stepCount = 0;
            lifetimeSteps = 0;
            viruses = [];
            isInfected = false;
            virusProgress = 0;
            virusSpreadCounter = 0;

            statusElement.textContent = "Healthy";
            statusElement.className = "";
            updateScoreboard();
            
            overlay.classList.add('hidden');
            isGameRunning = true;
            changingDirection = false;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 180); 
        }

        function gameLoop() {
            changingDirection = false;
            clearCanvas();
            manageViruses();
            moveSnake();
            
            if (isGameRunning) {
                updateViruses();
                drawViruses();
                drawSnake();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                let isSegmentInfected = false;
                if (isInfected) {
                    let distanceFromTail = (snake.length - 1) - index;
                    if (distanceFromTail < virusProgress) {
                        isSegmentInfected = true;
                    }
                }

                if (isSegmentInfected) {
                    ctx.fillStyle = '#9c27b0'; 
                } else {
                    ctx.fillStyle = index === 0 ? '#4CAF50' : '#388E3C'; 
                }

                ctx.strokeStyle = '#111111';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            });
        }

        function moveSnake() {
            if (snake.length === 0) return;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver("CRASHED INTO WALL");
                return;
            }

            // Self-Collision check
            let splitIndex = -1;
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    splitIndex = i;
                    break;
                }
            }

            if (splitIndex !== -1) {
                let cutSegmentsCount = snake.length - splitIndex;
                let uninfectedTailLength = snake.length - virusProgress;

                snake = snake.slice(0, splitIndex);
                flashEffect('rgba(33, 150, 243, 0.4)'); 

                if (isInfected) {
                    if (splitIndex <= uninfectedTailLength) {
                        isInfected = false;
                        virusProgress = 0;
                        virusSpreadCounter = 0;
                        statusElement.textContent = "Healthy";
                        statusElement.className = "";
                    } else {
                        virusProgress = Math.max(0, virusProgress - cutSegmentsCount);
                    }
                }
            }

            snake.unshift(head);

            stepCount++;
            lifetimeSteps++;
            if (stepCount >= stepsPerGrowth) {
                stepCount = 0;
                score += 5; 
            } else {
                snake.pop(); 
            }

            if (snake.length === 0) {
                gameOver("SNAKE ELIMINATED");
                return;
            }

            if (isInfected) {
                virusSpreadCounter++;
                if (virusSpreadCounter >= virusSpreadDelay) {
                    virusSpreadCounter = 0;
                    virusProgress++;
                    
                    if (virusProgress >= snake.length) {
                        gameOver("VIRUS REACHED HEAD");
                        return;
                    }
                }
            }

            checkVirusCollisions();
            updateScoreboard();
        }

        function getDangerLevel() {
            return Math.floor(lifetimeSteps / stepsPerDangerIncrease) + 1;
        }

        function manageViruses() {
            let currentDanger = getDangerLevel();
            // Scaling thresholds: baseline max blocks and higher spawn frequency 
            let maxBlocks = 3 + currentDanger; 
            let spawnChance = 0.05 + (currentDanger * 0.02);

            if (viruses.length < maxBlocks && Math.random() < spawnChance) {
                spawnVirus();
            }
        }

        function spawnVirus() {
            const edge = Math.floor(Math.random() * 4);
            let x, y, vx, vy;

            if (edge === 0) { 
                x = Math.floor(Math.random() * tileCount); y = -1; vx = 0; vy = 1;
            } else if (edge === 1) { 
                x = tileCount; y = Math.floor(Math.random() * tileCount); vx = -1; vy = 0;
            } else if (edge === 2) { 
                x = Math.floor(Math.random() * tileCount); y = tileCount; vx = 0; vy = -1;
            } else { 
                x = -1; y = Math.floor(Math.random() * tileCount); vx = 1; vy = 0;
            }

            viruses.push({ x, y, vx, vy });
        }

        function updateViruses() {
            for (let i = viruses.length - 1; i >= 0; i--) {
                viruses[i].x += viruses[i].vx;
                viruses[i].y += viruses[i].vy;

                if (viruses[i].x < -1 || viruses[i].x > tileCount || viruses[i].y < -1 || viruses[i].y > tileCount) {
                    viruses.splice(i, 1);
                }
            }
        }

        function drawViruses() {
            ctx.fillStyle = '#e040fb'; 
            viruses.forEach(v => {
                ctx.fillRect(v.x * gridSize + 2, v.y * gridSize + 2, gridSize - 4, gridSize - 4);
            });
        }

        function checkVirusCollisions() {
            if (isInfected) return; 

            for (let v of viruses) {
                for (let segment of snake) {
                    if (v.x === segment.x && v.y === segment.y) {
                        isInfected = true;
                        virusProgress = 1; 
                        virusSpreadCounter = 0;
                        statusElement.textContent = "INFECTED!";
                        statusElement.className = "infected";
                        flashEffect('rgba(156, 39, 176, 0.5)'); 
                        return; 
                    }
                }
            }
        }

        function handleKeyDown(event) {
            if (!isGameRunning) return;
            if (changingDirection) return;

            const keyPressed = event.key.toLowerCase();
            const goingUp = (dy === -1);
            const goingDown = (dy === 1);
            const goingRight = (dx === 1);
            const goingLeft = (dx === -1);

            if ((keyPressed === 'a' || event.key === 'ArrowLeft') && !goingRight) {
                dx = -1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'd' || event.key === 'ArrowRight') && !goingLeft) {
                dx = 1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'w' || event.key === 'ArrowUp') && !goingDown) {
                dx = 0; dy = -1; changingDirection = true;
            }
            if ((keyPressed === 's' || event.key === 'ArrowDown') && !goingUp) {
                dx = 0; dy = 1; changingDirection = true;
            }
        }

        function updateScoreboard() {
            scoreElement.textContent = score;
            lengthElement.textContent = snake.length;
            dangerElement.textContent = getDangerLevel();
        }

        function flashEffect(colorStyle) {
            ctx.fillStyle = colorStyle;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function gameOver(message) {
            isGameRunning = false;
            clearInterval(gameInterval);
            
            overlayText.innerHTML = message + "<br><span style='font-size: 1.2rem; color: #aaa;'>Final Score: " + score + "</span>";
            overlayText.style.color = "#f44336";
            startBtn.textContent = "Try Again";
            overlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
