<!doctype html>
<html lang="en" data-theme="dark" data-accent="meadow">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Green Grass</title>
  <meta name="description" content="Green Grass — games, a built-in HTML emulator, live chat, and useful tools, all in one place." />
  <meta name="theme-color" content="#050a07" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('gg.theme') || '"dark"');
      var a = JSON.parse(localStorage.getItem('gg.accent') || '"meadow"');
      document.documentElement.dataset.theme = t; document.documentElement.dataset.accent = a;
    } catch (e) {}
  </script>
</head>
<body>
  <noscript><p style="padding:40px;font-family:system-ui">Green Grass needs JavaScript enabled.</p></noscript>
  <div id="boot-fallback" style="display:none;max-width:560px;margin:12vh auto;padding:28px;font:15px/1.6 system-ui,sans-serif;color:#e9f5ee;background:#0c1711;border:1px solid rgba(170,255,200,.13);border-radius:18px">
    <h2 style="margin:0 0 8px;font-size:20px">Green Grass didn't start</h2>
    <p style="margin:0 0 12px;color:#9fb8a9">Usually this means your browser has an old copy cached, or a file was blocked on this network.</p>
    <pre id="boot-error" style="white-space:pre-wrap;background:#050a07;padding:12px;border-radius:10px;font-size:12.5px;color:#ff9aa2;margin:0 0 16px"></pre>
    <button onclick="ggRefreshFiles()" style="font:600 14px system-ui;padding:10px 18px;border-radius:10px;border:0;background:#3ee07f;color:#03140a;cursor:pointer">Reload fresh copy</button>
  </div>
  <script>
    // If the app fails to boot, show why instead of a blank page.
    (function () {
      var errs = [];
      var FILES = ['app', 'config', 'fb', 'data', 'ui', 'player', 'runner', 'linkcheck', 'onboarding', 'chat', 'emulator']
        .map(function (f) { return 'assets/js/' + f + '.js'; }).concat(['assets/css/app.css', 'data/seed.json']);
      // Re-download every file past the browser cache, then reload.
      window.ggRefreshFiles = function () {
        Promise.all(FILES.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); }))
          .then(function () { location.reload(); });
      };
      function show() {
        if (document.querySelector('.app')) return;
        // First failure this session: silently refresh cached files once.
        var tried = false;
        try { tried = sessionStorage.getItem('gg.bootRetry') === '1'; sessionStorage.setItem('gg.bootRetry', '1'); } catch (e) { tried = true; }
        if (!tried) { window.ggRefreshFiles(); return; }
        document.getElementById('boot-fallback').style.display = 'block';
        document.getElementById('boot-error').textContent = errs.length ? errs.join('\n') : 'The app script did not load (timed out). A file may be blocked or cached.';
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.src || t.href)) errs.push('Could not load: ' + (t.src || t.href));
        else errs.push((e.message || 'Error') + (e.filename ? '\n  at ' + e.filename.split('/').slice(-3).join('/') + ':' + e.lineno : ''));
        setTimeout(show, 50);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); setTimeout(show, 50); });
      setTimeout(show, 8000);
    })();
  </script>
  <script type="module" src="assets/js/app.js?v=3"></script>
</body>
</html>
