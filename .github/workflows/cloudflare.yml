name: Deploy to Cloudflare Pages mirrors

# Deploys the site to one or more Cloudflare Pages projects on every push.
# Each project = one free address: https://<project-name>.pages.dev
#
# Setup (once):
#   Repo -> Settings -> Secrets and variables -> Actions
#     Secrets:   CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#                CLOUDFLARE_ACCOUNT_ID
#     Variables: CF_PROJECTS            e.g.  green-grass,gg-mirror,grassy-hub
# Projects that don't exist yet are created automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECTS: ${{ vars.CF_PROJECTS || 'green-grass' }}
    steps:
      - name: Skip if Cloudflare isn't configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping Cloudflare deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Build upload folder
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='apps-script' ./ /tmp/site/

      - name: Deploy to each project
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          IFS=',' read -ra NAMES <<< "$CF_PROJECTS"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$name" ] && continue
            echo "::group::$name"
            npx --yes wrangler@3 pages project create "$name" --production-branch main 2>/dev/null || true
            npx --yes wrangler@3 pages deploy /tmp/site --project-name "$name" --branch main --commit-dirty=true
            echo "Live: https://$name.pages.dev"
            echo "::endgroup::"
          done
